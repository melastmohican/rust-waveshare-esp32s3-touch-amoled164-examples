[package]
edition      = "2024"
name         = "rust-waveshare-esp32s3-touch-amoled164-examples"
rust-version = "1.88"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
description  = "Rust Embassy examples for the Waveshare ESP32-S3-Touch-AMOLED-1.64 development board"
keywords     = ["esp32s3", "embassy", "embedded", "waveshare", "amoled"]
categories   = ["embedded", "no-std"]

[dependencies]
critical-section       = "1.2.0"
defmt                  = "1.0.1"
display-driver-qspi    = { git = "https://github.com/decaday/display-driver" }
embassy-executor       = { version = "0.10.0", features = ["defmt"] }
embassy-time           = { version = "0.5.0", features = ["defmt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }
esp-hal                = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }
esp-println            = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }
esp-rtos               = { version = "0.3.0", features = ["defmt", "embassy", "esp32s3"] }
static_cell            = "2.1.1"

[dev-dependencies]
display-driver        = { git = "https://github.com/decaday/display-driver" }
display-driver-co5300 = { git = "https://github.com/decaday/display-driver" }
embedded-graphics     = "0.8.1"
embedded-hal-bus      = "0.2.0"
esp-backtrace         = { version = "0.19.0", features = ["esp32s3", "panic-handler", "defmt"] }
ft3x68-rs             = "0.1.2"
ph-qmi8658            = "0.1.1"
tinybmp               = "0.7.0"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
